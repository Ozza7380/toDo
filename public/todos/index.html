<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todos</title>
</head>
<body>
    <div>
        <header>
            <h1>Halo <span id="username">!</span></h1>
            <a href="/logout/">Logout</a>
        </header>

        <main>
            <h2>Todos Anda</h2>
            <form id="addTodoForm">
                <input type="text" id="noteInput" placeholder="Apa yang perlu dilakukan?" required>
                <button type="submit">Tambah</button>
            </form>
            <ul id="todoList"></ul>
        </main>
    </div>

    <script>
        const usernameSpan = document.getElementById('username');
        const addTodoForm = document.getElementById('addTodoForm');
        const noteInput = document.getElementById('noteInput');
        const todoList = document.getElementById('todoList');

        // 1. Periksa login dan dapatkan data pengguna
        (async () => {
            try {
                const response = await fetch('/api/me');
                if (!response.ok) {
                    window.location.href = '/login/';
                    return;
                }
                const { success, data } = await response.json();
                if (success) {
                    usernameSpan.textContent = data.username;
                    //fetchTodos()//muat todos setelah user terindetifikasi
                } else {
                    window.location.href = '/login/'
                }
            } catch (error) {
                window.location.href = '/login/'
            }
        })();
        //2. fungsi untuk mengambil dan menampilkan todos
        const fetchTodos = async () => {
            try {
                const response = await fetch('/api/todos');//endpoint GET
                const { success, data } = await response.json();
                if (success) {
                    todoList.innerHTML = ''; //kosongkan daftar
                    data.forEach((todo) => {
                        
                        const li = document.createElement('li');
                        li.textContent = todo.note;

                        const btnDetail = document.createElement('button');
                        btnDetail.textContent = "Detail";

                        const btnEdit = document.createElement('button');
                        btnEdit.textContent = "Edit";

                        const btnDelete = document.createElement('button');
                        btnDelete.textContent = "Delete"

                        btnDelete.onclick = function() {
                            const ya = confirm("Apakah anda ingin menghapus data ini?")
                            if (ya) {
                                alert('Data berhasil dihapus')
                            } else {
                                alert('Aksi dibatalkan')
                            }
                        };

                        btnEdit.onclick = function() {
                            window.location.href = `/todos/edit/?id_todo=${todo.id}`
                        };

                        btnDetail.onclick = function() {
                            alert(`
                            id: ${todo.id}
                            note: ${todo.note}
                            user id: ${todo.user_id}`)
                        };

                        li.appendChild(btnDelete);
                        li.appendChild(btnEdit);
                        li.appendChild(btnDetail);
                        todoList.appendChild(li);

                        
                    });
                }
            } catch (error) {
                console.error('Gagal mengambil todos:', error);
            }
        };
        fetchTodos();

        //3. event listener menambah todo baru 
        addTodoForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const note = noteInput.value;

            
            try {
                if (!note) {
                alert('Note harus diisi!')
                return;
            }
                const response = await fetch('/api/todos', {
                    method: 'POST',
                    headers: { 'Content-type': 'application/json' },
                    body: JSON.stringify({ note })
                });
                const { success } = await response.json();
                if (success) {
                    noteInput.value = '';
                    fetchTodos();//muat ulang daftar todos
                }
            } catch (error) {
                console.error('Gagal menambah todo:', error)
            }
        });

    </script>
</body>
</html>
